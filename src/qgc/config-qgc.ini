; QGC 飞控地面站配置
; Mock = true（默认）时启动进程内模拟飞控（真实 MAVLink v2 帧），无需硬件

[Udp]
; 模拟模式开关：true = 进程内模拟飞控；false = 连接真实飞控
Mock = true
; 地面站监听端口（飞控遥测发送目标；模拟器自动使用 LocalPort+1）
LocalPort = 14550
; 真实模式下的命令目标（Mock = false 时生效；Mock 模式自动学习对端地址）
TargetIp = 127.0.0.1
TargetPort = 14551

[Gcs]
; 地面站 MAVLink 系统 ID / 组件 ID（心跳与下行帧使用）
SysId = 255
CompId = 190
; 地面站心跳周期（毫秒，默认 1000）
HeartbeatMs = 1000
; 遥测推送频率（Hz，默认 10）
TelemetryHz = 10

[Tiles]
; 地图瓦片源 URL 模板（{z}/{x}/{y} 为占位符）；后端代理下载并缓存到磁盘
; tiles/ 目录，离线/内网环境下直接从缓存加载。修改后需重启服务生效。
; 默认高德路网图（国内可直连）；内网部署可换成内网瓦片服务器地址
Url = https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}
