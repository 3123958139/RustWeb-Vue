# 发动机监控模块配置文件（从 fj200c_information.informatization 迁移）
# 服务启动时从程序工作目录读取本文件，修改后保存即可（无需重启服务）

[Mock]
# 进程内模拟数据源：true 时不依赖真实串口硬件
InProcess = false
# 虚拟串口对模式（需配合真实串口使用，一般无需开启）
FeederMode = false

[Connection0]
Enabled = true
ComPort = COM10
BaudRate = 115200
DataBits = 8
StopBits = 1
Parity = 2
FlowControl = false

[Connection1]
Enabled = false
ComPort = COM4
BaudRate = 115200
DataBits = 8
StopBits = 1
Parity = 0
FlowControl = false

[CSV]
# 试验数据下载时自动记录 CSV（SYSJSK 开始 / SYSJMK 结束）
Enabled = false
Dir = csv

# ============================================================
